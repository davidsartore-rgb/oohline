# Nginx reverse proxy — OOH Line (oohline.ch)
# Place this file at /etc/nginx/sites-available/oohline.ch
# then: ln -s /etc/nginx/sites-available/oohline.ch /etc/nginx/sites-enabled/
# Assumes Certbot manages SSL at /etc/letsencrypt/live/oohline.ch/

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name oohline.ch www.oohline.ch;
    return 301 https://oohline.ch$request_uri;
}

# Redirect www → apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.oohline.ch;

    ssl_certificate     /etc/letsencrypt/live/oohline.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oohline.ch/privkey.pem;

    return 301 https://oohline.ch$request_uri;
}

# Main server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oohline.ch;

    ssl_certificate     /etc/letsencrypt/live/oohline.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oohline.ch/privkey.pem;

    # Modern TLS — disable old protocols
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;

    # Security headers (Node.js also sets these via @fastify/helmet;
    # Nginx is a second layer and its values take precedence for static assets)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Don't advertise Nginx version
    server_tokens off;

    # Max upload size for XLSX imports
    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain;

    # Logs
    access_log /var/log/nginx/oohline.access.log;
    error_log  /var/log/nginx/oohline.error.log;

    # ── Proxy everything to Fastify ──────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep-alive passthrough
        proxy_set_header Connection "";

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Don't buffer large responses (XLSX export, base64 logos)
        proxy_buffering off;
    }

    # ── Block dotfiles ───────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Rate-limit the login endpoint at Nginx level (belt-and-suspenders) ──
    # Fastify's @fastify/rate-limit does fine-grained limiting; Nginx adds a
    # coarse safeguard so heavy hammering never reaches Node at all.
    # Declare the zone in the http{} block of nginx.conf (not this file):
    #   limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
